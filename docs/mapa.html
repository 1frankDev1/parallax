<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa 3D de Restaurantes - Menutech</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- MapLibre GL JS CSS & JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Global Badge & UI CSS -->
    <link rel="stylesheet" href="./assets/css/badge.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-dark: #0f1117;
            --panel-bg: rgba(22, 26, 36, 0.92);
            --card-bg: #1c2230;
            --card-border: rgba(255, 162, 0, 0.2);
            --accent-orange: #ffa200;
            --accent-blue: #00aaff;
            --text-main: #f0f3f8;
            --text-muted: #94a3b8;
            --shadow-glow: 0 0 15px rgba(255, 162, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
        }

        /* --- MAP CONTAINER --- */
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #090a0f;
        }

        /* --- SIDEBAR PANEL --- */
        .sidebar {
            position: absolute;
            top: 75px;
            left: 20px;
            bottom: 20px;
            width: 380px;
            max-width: calc(100vw - 40px);
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 162, 0, 0.2);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 20px 20px 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-title span {
            color: var(--accent-orange);
        }

        .stats-badge {
            background: rgba(255, 162, 0, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 162, 0, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Controls / Filters */
        .filter-section {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: rgba(15, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px rgba(255, 162, 0, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
        }

        .select-group {
            display: flex;
            gap: 10px;
        }

        .select-group select {
            flex: 1;
            padding: 10px 12px;
            background: rgba(15, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .select-group select:focus {
            border-color: var(--accent-orange);
        }

        .btn-reset {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset:hover {
            background: rgba(255, 162, 0, 0.15);
            color: var(--accent-orange);
            border-color: rgba(255, 162, 0, 0.3);
        }

        /* Restaurant List */
        .restaurant-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .restaurant-list::-webkit-scrollbar {
            width: 6px;
        }

        .restaurant-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .rest-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .rest-card:hover, .rest-card.active {
            border-color: var(--accent-orange);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 162, 0, 0.15);
        }

        .rest-thumb {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .rest-info {
            flex: 1;
            min-width: 0;
        }

        .rest-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rest-addr {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .rest-phone {
            font-size: 0.75rem;
            color: var(--accent-blue);
            margin-top: 4px;
        }

        /* Loading & Empty State */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-muted);
            gap: 10px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 162, 0, 0.2);
            border-top-color: var(--accent-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Custom Marker Styles */
        .custom-marker {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #111;
            border: 2px solid var(--accent-orange);
            box-shadow: 0 0 15px rgba(255, 162, 0, 0.6);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .custom-marker:hover, .custom-marker.selected {
            transform: scale(1.25);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 162, 0, 0.9), 0 0 10px #ffffff;
            z-index: 100;
        }

        .custom-marker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Map Popup Customization */
        .maplibregl-popup {
            max-width: 280px !important;
            z-index: 50;
        }

        .maplibregl-popup-content {
            background: var(--panel-bg) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 162, 0, 0.4) !important;
            border-radius: 14px !important;
            padding: 16px !important;
            color: #fff !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 162, 0, 0.2) !important;
        }

        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: var(--panel-bg) !important;
        }

        .popup-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .popup-logo {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .popup-address {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .popup-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .popup-link {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #fff;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .popup-link:hover {
            background: var(--accent-orange);
            color: #111;
            font-weight: 600;
        }

        .popup-link svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .sidebar {
                top: 10px;
                left: 10px;
                right: 10px;
                width: auto;
                max-height: 50vh;
                bottom: auto;
            }
        }
    </style>
</head>
<body>

  <!-- ICONO Y BADGE (sin barra, con margen propio) -->
  <img id="login-icon" class="login-icon" src="./assets/img/user.svg">

  <!-- Placa del usuario -->
  <div id="user-badge" class="user-badge hidden" style="position: fixed;">
    <div id="badge-username"></div>
    <div id="badge-role"></div>
  </div>

  <!-- Menú fuera del badge -->
  <div id="badge-menu" class="hidden">
    <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
  </div>

  <!-- PANEL DE LOGIN -->
  <div id="login-panel" class="login-panel hidden">
    <h3>Iniciar sesión</h3>
    <input id="user" class="input" placeholder="Usuario">
    <input id="pass" class="input" type="password" placeholder="Contraseña">
    <button id="login-btn" class="login-btn">Entrar</button>
    <div id="login-status" class="status"></div>
  </div>

  <!-- DRAWER Y THEMES -->
  <menutech-drawer id="main-drawer" class="hidden"></menutech-drawer>

  <!-- NAVBAR NEOMÓRFICO INFERIOR -->
  <div class="neo-nav-container">
      <button id="neoNavBack" class="neo-nav-btn">
          <svg viewBox="0 0 24 24" class="neo-nav-icon">
              <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
      </button>
      <button id="neoNavHome" class="neo-nav-btn">
          <svg viewBox="0 0 24 24" class="neo-nav-icon">
              <path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4H9v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
      </button>
  </div>
  <menutech-themes></menutech-themes>
  <menutech-chatbot></menutech-chatbot>

  <!-- APP CONTAINER -->
  <div id="app-container">
      <!-- 3D MAP -->
      <div id="map"></div>

      <!-- SIDEBAR -->
      <aside class="sidebar">
          <div class="sidebar-header">
              <div class="sidebar-title">
                  <span>Mapa 3D</span> Restaurantes
              </div>
              <div class="stats-badge" id="rest-count">0 Ubicaciones</div>
          </div>

          <div class="filter-section">
              <div class="search-box">
                  <svg class="search-icon" viewBox="0 0 24 24">
                      <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                  <input type="text" id="search-input" placeholder="Buscar por nombre, ciudad o dirección...">
              </div>

              <div class="select-group">
                  <select id="state-filter">
                      <option value="">Todos los Estados</option>
                  </select>
                  <select id="city-filter">
                      <option value="">Todas las Ciudades</option>
                  </select>
              </div>

              <button id="reset-btn" class="btn-reset">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/>
                      <path d="M3 3v5h5"/>
                  </svg>
                  Restablecer Filtros
              </button>
          </div>

          <!-- LIST OF RESTAURANTS -->
          <div class="restaurant-list" id="restaurant-list">
              <div class="loading-spinner">
                  <div class="spinner"></div>
                  <span>Cargando restaurantes...</span>
              </div>
          </div>
      </aside>
  </div>

  <script src="./assets/js/badge.js"></script>
  <script src="./assets/js/menutechUI.js"></script>
  <script src="./assets/js/renderer.js"></script>

  <script>
    // Initial US camera view configuration
    const INITIAL_VIEW = {
        center: [-98.5795, 39.8283], // Center of USA
        zoom: 4.2,
        pitch: 50, // 3D Tilt Angle
        bearing: -10 // 3D Rotation Angle
    };

    let map = null;
    let supabaseClient = null;
    let allRestaurants = [];
    let activeMarkers = [];
    let activePopupsMap = {};

    const SUPABASE_URL = 'https://ojpyfjgkffmzwvukjagf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qcHlmamdrZmZtend2dWtqYWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxNDIwMzYsImV4cCI6MjA3OTcxODAzNn0.dlVYmoMumBse_O1PLBx0FeNITqY4YktefD6l_uonSgo';

    function initSupabase() {
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase initialized successfully.');
            setupRealtimeSubscription();
        } else {
            console.error('Supabase library not loaded.');
        }
    }

    async function fetchRestaurants() {
        if (!supabaseClient) return [];
        try {
            const { data, error } = await supabaseClient
                .from('restaurantes')
                .select('*')
                .order('nombre', { ascending: true });

            if (error) {
                console.error('Error fetching restaurantes:', error);
                return [];
            }
            allRestaurants = data || [];
            return allRestaurants;
        } catch (err) {
            console.error('Unexpected error fetching restaurants:', err);
            return [];
        }
    }

    function setupRealtimeSubscription() {
        if (!supabaseClient) return;
        supabaseClient
            .channel('public:restaurantes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'restaurantes' }, async (payload) => {
                console.log('Realtime change detected in restaurantes:', payload);
                await loadAndRenderData();
            })
            .subscribe();
    }

    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: INITIAL_VIEW.center,
            zoom: INITIAL_VIEW.zoom,
            pitch: INITIAL_VIEW.pitch,
            bearing: INITIAL_VIEW.bearing,
            antialias: true
        });

        // Add 3D camera navigation controls
        const nav = new maplibregl.NavigationControl({
            visualizePitch: true,
            showCompass: true,
            showZoom: true
        });
        map.addControl(nav, 'top-right');

        // Add fullscreen control
        map.addControl(new maplibregl.FullscreenControl(), 'top-right');

        map.on('load', async () => {
            console.log('MapLibre 3D Map successfully initialized.');
            initSupabase();
            await loadAndRenderData();
        });
    }

    // Geocoding helper with localStorage cache
    const GEOCODE_CACHE_KEY = 'mt_restaurant_geocode_cache_v1';

    function getGeocodeCache() {
        try {
            return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)) || {};
        } catch (e) {
            return {};
        }
    }

    function setGeocodeCache(cache) {
        try {
            localStorage.setItem(GEOCODE_CACHE_KEY, JSON.stringify(cache));
        } catch (e) {
            console.warn('Unable to write to localStorage:', e);
        }
    }

    async function geocodeAddress(address, restaurant) {
        // If DB already has lat/lng or latitude/longitude columns
        if (restaurant.lat && restaurant.lng) {
            return { lat: parseFloat(restaurant.lat), lng: parseFloat(restaurant.lng) };
        }
        if (restaurant.latitud && restaurant.longitud) {
            return { lat: parseFloat(restaurant.latitud), lng: parseFloat(restaurant.longitud) };
        }

        if (!address || typeof address !== 'string' || address.trim().length < 4) {
            return null;
        }

        const cleanAddress = address.trim().toLowerCase();
        const cache = getGeocodeCache();

        if (cache[cleanAddress]) {
            return cache[cleanAddress];
        }

        // Call Nominatim API (US restricted)
        try {
            // Append USA if not present
            let searchAddress = cleanAddress;
            if (!searchAddress.includes('usa') && !searchAddress.includes('united states')) {
                searchAddress += ', USA';
            }

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchAddress)}&countrycodes=us&limit=1`;
            const resp = await fetch(url, {
                headers: {
                    'User-Agent': 'Menutech3DMap/1.0 (info@menutech.services)'
                }
            });

            if (!resp.ok) return null;

            const results = await resp.json();
            if (results && results.length > 0) {
                const coords = {
                    lat: parseFloat(results[0].lat),
                    lng: parseFloat(results[0].lon)
                };
                cache[cleanAddress] = coords;
                setGeocodeCache(cache);
                return coords;
            }
        } catch (e) {
            console.warn(`Geocoding error for address "${address}":`, e);
        }

        return null;
    }

    // Primary default logo path and fallback image
    const DEFAULT_LOGO = './assets/img/mtLogo.png';
    const FALLBACK_LOGO = './assets/img/menutech.png';

    function createMarkerElement(restaurant) {
        const el = document.createElement('div');
        el.className = 'custom-marker';
        el.dataset.id = restaurant.id;

        const img = document.createElement('img');
        img.src = restaurant.logo || DEFAULT_LOGO;
        img.alt = restaurant.nombre || 'Restaurante';
        img.onerror = function() {
            if (this.src !== FALLBACK_LOGO) {
                this.src = FALLBACK_LOGO;
            }
        };

        el.appendChild(img);
        return el;
    }

    function createPopupHTML(restaurant) {
        let websiteUrl = restaurant.website;
        if (websiteUrl && !websiteUrl.startsWith('http://') && !websiteUrl.startsWith('https://')) {
            websiteUrl = 'https://' + websiteUrl;
        }

        let linksHTML = '';
        if (websiteUrl) {
            linksHTML += `<a class="popup-link" href="${websiteUrl}" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 17.93V18c0-.55-.45-1-1-1h-2a1 1 0 01-1-1v-1c0-.55-.45-1-1-1H7a1 1 0 01-1-1v-2c0-.55.45-1 1-1h1a1 1 0 001-1V8c0-.55.45-1 1-1h1a1 1 0 001-1V5.07A8.001 8.001 0 0113 19.93z"/></svg> Web
            </a>`;
        }
        if (restaurant.facebook) {
            linksHTML += `<a class="popup-link" href="${restaurant.facebook}" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.128 22 16.991 22 12z"/></svg> FB
            </a>`;
        }
        if (restaurant.instagram) {
            linksHTML += `<a class="popup-link" href="${restaurant.instagram}" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.85s-.012 3.584-.07 4.85c-.148 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07s-3.584-.012-4.85-.07c-3.252-.148-4.771-1.691-4.919-4.919-.058-1.265-.069-1.645-.069-4.85s.012-3.584.07-4.85c.148-3.225 1.664-4.771 4.919-4.919C8.416 2.175 8.796 2.163 12 2.163z"/></svg> IG
            </a>`;
        }

        return `
            <div class="popup-header">
                <img src="${restaurant.logo || DEFAULT_LOGO}" class="popup-logo" alt="${restaurant.nombre}" onerror="this.src='${DEFAULT_LOGO}'">
                <div class="popup-title">${restaurant.nombre || 'Restaurante'}</div>
            </div>
            <div class="popup-address">${restaurant.direccion || 'Sin dirección registrada'}</div>
            <div class="popup-links">${linksHTML}</div>
        `;
    }

    function clearMarkersAndPopups() {
        activeMarkers.forEach(m => m.remove());
        activeMarkers = [];
        Object.values(activePopupsMap).forEach(p => p.remove());
        activePopupsMap = {};
    }

    // Parse US State & City from address string (e.g., "8761 W University Blvd, Odessa, TX 79764, USA")
    function parseLocationDetails(address) {
        if (!address) return { city: '', state: '' };

        const parts = address.split(',').map(s => s.trim());
        let state = '';
        let city = '';

        // Check parts for state codes (e.g. TX, NE) or postal codes
        for (let i = parts.length - 1; i >= 0; i--) {
            const part = parts[i];
            const stateMatch = part.match(/\b([A-Z]{2})\b\s*(\d{5})?/);
            if (stateMatch && stateMatch[1] !== 'US') {
                state = stateMatch[1];
                if (i > 0) city = parts[i - 1];
                break;
            }
        }

        if (!city && parts.length >= 2) {
            city = parts[parts.length - 2];
        }

        return { city, state };
    }

    let processedRestaurants = []; // Stores cached coordinates & parsed location data

    async function loadAndRenderData() {
        const listContainer = document.getElementById('restaurant-list');
        listContainer.innerHTML = `
            <div class="loading-spinner">
                <div class="spinner"></div>
                <span>Cargando restaurantes...</span>
            </div>`;

        const rawData = await fetchRestaurants();
        processedRestaurants = [];

        for (const r of rawData) {
            const coords = await geocodeAddress(r.direccion, r);
            const loc = parseLocationDetails(r.direccion);
            processedRestaurants.push({
                ...r,
                coords: coords,
                state: loc.state,
                city: loc.city
            });
            // Small pause between uncached geocoding requests to respect API rate limits
            if (!r.lat && !r.lng && !r.latitud && !r.longitud) {
                await new Promise(res => setTimeout(res, 300));
            }
        }

        populateFilterDropdowns();
        renderFilteredData();
    }

    function populateFilterDropdowns() {
        const stateSelect = document.getElementById('state-filter');
        const citySelect = document.getElementById('city-filter');

        const states = new Set();
        const cities = new Set();

        processedRestaurants.forEach(r => {
            if (r.state) states.add(r.state.toUpperCase());
            if (r.city) cities.add(r.city);
        });

        const currentSelectedState = stateSelect.value;
        const currentSelectedCity = citySelect.value;

        stateSelect.innerHTML = '<option value="">Todos los Estados</option>';
        Array.from(states).sort().forEach(st => {
            const opt = document.createElement('option');
            opt.value = st;
            opt.textContent = st;
            if (st === currentSelectedState) opt.selected = true;
            stateSelect.appendChild(opt);
        });

        citySelect.innerHTML = '<option value="">Todas las Ciudades</option>';
        Array.from(cities).sort().forEach(ct => {
            const opt = document.createElement('option');
            opt.value = ct;
            opt.textContent = ct;
            if (ct === currentSelectedCity) opt.selected = true;
            citySelect.appendChild(opt);
        });
    }

    function renderFilteredData() {
        clearMarkersAndPopups();

        const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
        const selectedState = document.getElementById('state-filter').value.toUpperCase();
        const selectedCity = document.getElementById('city-filter').value.toLowerCase();

        const filtered = processedRestaurants.filter(r => {
            const matchesSearch = !searchVal ||
                (r.nombre && r.nombre.toLowerCase().includes(searchVal)) ||
                (r.direccion && r.direccion.toLowerCase().includes(searchVal)) ||
                (r.city && r.city.toLowerCase().includes(searchVal));

            const matchesState = !selectedState || (r.state && r.state.toUpperCase() === selectedState);
            const matchesCity = !selectedCity || (r.city && r.city.toLowerCase() === selectedCity);

            return matchesSearch && matchesState && matchesCity;
        });

        // Update count badge
        document.getElementById('rest-count').textContent = `${filtered.length} ${filtered.length === 1 ? 'Ubicación' : 'Ubicaciones'}`;

        const listContainer = document.getElementById('restaurant-list');
        listContainer.innerHTML = '';

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div class="empty-state">No se encontraron restaurantes con los filtros aplicados.</div>`;
            return;
        }

        filtered.forEach(r => {
            // Render sidebar card
            const card = document.createElement('div');
            card.className = 'rest-card';
            card.dataset.id = r.id;
            card.innerHTML = `
                <img src="${r.logo || DEFAULT_LOGO}" class="rest-thumb" alt="${r.nombre}" onerror="this.src='${DEFAULT_LOGO}'">
                <div class="rest-info">
                    <div class="rest-name">${r.nombre || 'Restaurante'}</div>
                    <div class="rest-addr">${r.direccion || 'Sin dirección'}</div>
                    ${r.telefono ? `<div class="rest-phone">${r.telefono}</div>` : ''}
                </div>
            `;

            // Card click action -> Focus map on restaurant
            card.addEventListener('click', () => {
                selectAndFocusRestaurant(r, card);
            });

            listContainer.appendChild(card);

            // Render Map Marker if valid coordinates exist
            if (r.coords) {
                const el = createMarkerElement(r);

                const popup = new maplibregl.Popup({
                    offset: 25,
                    closeButton: false,
                    className: 'custom-popup'
                }).setHTML(createPopupHTML(r));

                const marker = new maplibregl.Marker({ element: el })
                    .setLngLat([r.coords.lng, r.coords.lat])
                    .setPopup(popup)
                    .addTo(map);

                // Hover event to preview restaurant popup
                el.addEventListener('mouseenter', () => {
                    if (!popup.isOpen()) {
                        popup.addTo(map);
                    }
                });
                el.addEventListener('mouseleave', () => {
                    // Keep open if this restaurant is currently active/selected
                    const activeCard = document.querySelector(`.rest-card.active[data-id="${r.id}"]`);
                    if (!activeCard) {
                        popup.remove();
                    }
                });

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectAndFocusRestaurant(r, card);
                });

                activeMarkers.push(marker);
                activePopupsMap[r.id] = popup;
            }
        });
    }

    function selectAndFocusRestaurant(restaurant, cardElement) {
        // Highlight active sidebar card
        document.querySelectorAll('.rest-card').forEach(c => c.classList.remove('active'));
        if (cardElement) {
            cardElement.classList.add('active');
            cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Highlight marker and trigger its popup
        document.querySelectorAll('.custom-marker').forEach(m => m.classList.remove('selected'));
        const markerEl = document.querySelector(`.custom-marker[data-id="${restaurant.id}"]`);
        if (markerEl) {
            markerEl.classList.add('selected');
        }

        // Close other popups and open popup for target restaurant
        Object.values(activePopupsMap).forEach(p => p.remove());
        if (activePopupsMap[restaurant.id] && map) {
            activePopupsMap[restaurant.id].addTo(map);
        }

        // Fly camera directly to restaurant location in 3D view
        if (restaurant.coords && map) {
            map.flyTo({
                center: [restaurant.coords.lng, restaurant.coords.lat],
                zoom: 16,
                pitch: 60,
                bearing: -15,
                duration: 2000,
                essential: true
            });
        }
    }

    function resetFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('state-filter').value = '';
        document.getElementById('city-filter').value = '';

        renderFilteredData();

        if (map) {
            map.flyTo({
                center: INITIAL_VIEW.center,
                zoom: INITIAL_VIEW.zoom,
                pitch: INITIAL_VIEW.pitch,
                bearing: INITIAL_VIEW.bearing,
                duration: 2000
            });
        }
    }

    function setupEventListeners() {
        document.getElementById('search-input').addEventListener('input', renderFilteredData);
        document.getElementById('state-filter').addEventListener('change', renderFilteredData);
        document.getElementById('city-filter').addEventListener('change', renderFilteredData);
        document.getElementById('reset-btn').addEventListener('click', resetFilters);
    }

    document.addEventListener('DOMContentLoaded', () => {
        setupEventListeners();
        initMap();
    });
  </script>
</body>
</html>
