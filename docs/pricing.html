<body>
  <!-- ICONO Y BADGE (sin barra, con margen propio) -->
<img id="login-icon" class="login-icon" src="./assets/img/user.svg">

  <!-- Placa del usuario -->
<div id="user-badge" class="user-badge hidden" style="position: fixed;">
  <div id="badge-username"></div>
  <div id="badge-role"></div>
</div>

<!-- Menú ahora fuera del badge -->
<div id="badge-menu" class="hidden">
  <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
</div>


<!-- PANEL DE LOGIN -->
<div id="login-panel" class="login-panel hidden">

  <h3>Iniciar sesión</h3>

  <input id="user" class="input" placeholder="Usuario">
  <input id="pass" class="input" type="password" placeholder="Contraseña">

  <button id="login-btn" class="login-btn">Entrar</button>

  <!-- Estado del login -->
  <div id="login-status" class="status"></div>
</div>

<!-- TU DRAWER -->
<menutech-drawer id="main-drawer" class="hidden"></menutech-drawer>


  <!-- NAVBAR NEOMÓRFICO INFERIOR -->

<!--inicio clase main_table-->
<main class="page pricing-table-page">
<section class="clean-block clean-pricing dark">
<div class="container">

<!--inicio tabla-->
<div class="dynamic-pricing-container">
    <div class="presets-container">
        <button class="preset-btn active" data-preset="starter">Starter</button>
        <button class="preset-btn" data-preset="premium">Premium</button>
        <button class="preset-btn" data-preset="deluxe">Deluxe</button>
    </div>

    <div class="builder-layout">
        <!-- Service Selection -->
        <div class="services-grid" id="services-grid">
            <!-- Dynamic services load here -->
        </div>

        <!-- Live Quote Sidebar -->
        <div class="quote-summary">
            <h2 class="quote-title">Package Summary</h2>
            <div id="selected-items-list" class="selected-items-list">
                <!-- Selected items here -->
            </div>

            <div class="summary-total">
                <div class="summary-row">
                    <span class="total-label">Setup</span>
                    <span id="total-setup" class="total-amount">$0.00</span>
                </div>
                <div class="summary-row">
                    <span class="total-label">Monthly</span>
                    <span id="total-monthly" class="total-amount">$0.00</span>
                </div>
            </div>

            <div class="save-form">
                <div class="form-group">
                    <label for="client-name">Name</label>
                    <input type="text" id="client-name" class="form-control-custom" placeholder="Name">
                </div>
                <button id="btn-save-package" class="btn-save-package">SAVE PACKAGE</button>
            </div>
        </div>
    </div>
</div>
</div>
</section>
