<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Admin Packages - Menutech</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/Diseño%20sin%20título%20(8).png">
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <style>
        :root {
            --brand-color: #ff8c00;
            --brand-hover: #ffa733;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f0f2f5;
            color: #2c3e50;
            min-height: 100vh;
        }
        .navbar-custom {
            background: #161b22;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand-text {
            color: white;
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
        }
        .sky-blue { color: #87CEEB; }

        .main-content {
            padding: 40px 0;
        }

        .page-title-section {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
            max-width: 400px;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid #ddd;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        /* Glass Cards */
        .package-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            margin-bottom: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .package-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 45px rgba(255, 140, 0, 0.12);
            border-color: rgba(255, 140, 0, 0.3);
        }

        .card-accent {
            height: 6px;
            background: linear-gradient(90deg, var(--brand-color), var(--brand-hover));
        }

        .card-header-custom {
            padding: 25px 25px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-client-name {
            font-weight: 800;
            font-size: 1.3rem;
            color: #1a1a1a;
            margin: 0;
        }

        .card-date {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
            margin-top: 5px;
        }

        .card-body-custom {
            padding: 0 25px 25px;
            flex-grow: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--brand-color);
        }

        .btn-action {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-action:hover {
            background: var(--brand-color);
            color: white;
            transform: scale(1.02);
        }

        /* Modal Enhancement */
        .modal-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px !important;
            border: 1px solid var(--glass-border) !important;
            overflow: hidden;
        }
        .modal-header-glass {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 25px 30px;
        }
        .modal-body-glass {
            padding: 30px;
        }
        .detail-card {
            background: #f9f9f9;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .service-pill {
            display: inline-block;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .service-pill.waived {
            border-color: #27ae60;
            color: #27ae60;
        }

        .quote-img-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            background: white;
            line-height: 0;
        }
        .quote-img-container img {
            width: 100%;
            transition: transform 0.5s;
        }
        .quote-img-container:hover img {
            transform: scale(1.05);
        }

        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 4rem;
            color: #eee;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <div class="container text-center">
            <h1 class="navbar-brand-text">Administracion <span class="sky-blue">Circle Center</span></h1>
        </div>
    </nav>

    <div class="container main-content">
        <div class="page-title-section">
            <div>
                <h2 style="font-weight: 800; margin: 0;">Packages Dashboard</h2>
                <p class="text-muted mb-0">Management of generated dynamic quotes</p>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Search by name or restaurant...">
            </div>
        </div>

        <div id="packages-container" class="row">
            <!-- Loading Spinner -->
            <div class="col-12 text-center p-5">
                <div class="spinner-border" style="color: var(--brand-color)" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="packageModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content modal-glass">
                <div class="modal-header modal-header-glass">
                    <h5 class="modal-title" id="modalClientName" style="font-weight: 800;">Package Details</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body modal-body-glass" id="modalContent">
                    <!-- Dynamic Content -->
                </div>
                <div class="modal-footer border-0 pb-4 pr-4">
                    <button type="button" class="btn btn-link text-muted" data-dismiss="modal">Close</button>
                    <a id="btnDownload" href="#" target="_blank" class="btn btn-primary" style="background: var(--brand-color); border: none; border-radius: 12px; padding: 12px 25px; font-weight: 700;">View Original Asset</a>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="./assets/js/renderer.js"></script>

    <script type="module">
        import { supabase } from "./assets/js/supabase.js";
        let allPackages = [];

        async function init() {
            loadPackages();

            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allPackages.filter(p => p.client_name.toLowerCase().includes(term));
                renderPackages(filtered);
            });
        }

        async function loadPackages() {
            try {
                const { data, error } = await supabase
                    .from('pricing_packages')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allPackages = data;
                renderPackages(data);
            } catch (err) {
                console.error('Error loading packages:', err);
                document.getElementById('packages-container').innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="alert alert-danger d-inline-block px-5" style="border-radius: 20px;">
                           <i class="fas fa-exclamation-triangle mr-2"></i> Error al cargar datos: ${err.message}
                        </div>
                    </div>
                `;
            }
        }

        function renderPackages(packages) {
            const container = document.getElementById('packages-container');
            if (packages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3>No packages found</h3>
                        <p class="text-muted">Once you create a package in the builder, it will appear here.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = packages.map(p => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="package-card">
                        <div class="card-accent"></div>
                        <div class="card-header-custom">
                            <div>
                                <h4 class="card-client-name">${p.client_name}</h4>
                                <div class="card-date">${new Date(p.created_at).toLocaleDateString(undefined, {year: 'numeric', month: 'long', day: 'numeric'})}</div>
                            </div>
                            <div style="background: rgba(255,140,0,0.1); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--brand-color);">
                                <i class="fas fa-file-invoice-dollar fa-lg"></i>
                            </div>
                        </div>
                        <div class="card-body-custom">
                            <div class="stats-grid">
                                <div class="stat-box">
                                    <span class="stat-label">Setup</span>
                                    <span class="stat-value">$${p.total_setup.toLocaleString()}</span>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-label">Monthly</span>
                                    <span class="stat-value">$${p.total_monthly.toLocaleString()}</span>
                                </div>
                            </div>
                            <button class="btn-action" onclick="viewDetails('${p.id}')">
                                <span>VIEW DETAILS</span>
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.viewDetails = function(id) {
            const pkg = allPackages.find(p => p.id === id);
            if (!pkg) return;

            document.getElementById('modalClientName').innerHTML = `<i class="fas fa-user-tie mr-2 text-primary"></i> Package for ${pkg.client_name}`;

            let servicesHtml = '';
            pkg.services.forEach(s => {
                servicesHtml += `<span class="service-pill ${s.is_free ? 'waived' : ''}">${s.name}</span>`;
            });

            document.getElementById('modalContent').innerHTML = `
                <div class="row">
                    <div class="col-lg-5">
                        <div class="detail-card">
                            <h5 style="font-weight: 800; margin-bottom: 20px;">Summary Info</h5>
                            <div class="mb-3 d-flex justify-content-between">
                                <span class="text-muted">Created:</span>
                                <span class="font-weight-600">${new Date(pkg.created_at).toLocaleString()}</span>
                            </div>
                            <div class="mb-3 d-flex justify-content-between align-items-center">
                                <span class="text-muted">Total Setup Fee:</span>
                                <span class="badge badge-pill badge-primary" style="font-size: 1.1rem; padding: 8px 20px;">$${pkg.total_setup.toLocaleString()}</span>
                            </div>
                            <div class="mb-4 d-flex justify-content-between align-items-center">
                                <span class="text-muted">Total Monthly Fee:</span>
                                <span class="badge badge-pill badge-success" style="font-size: 1.1rem; padding: 8px 20px;">$${pkg.total_monthly.toLocaleString()}</span>
                            </div>

                            <h6 class="font-weight-800 mt-4 mb-3">Included Services:</h6>
                            <div class="d-flex flex-wrap">
                                ${servicesHtml}
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <h6 class="font-weight-800 mb-3">Visual Quote Asset:</h6>
                        <div class="quote-img-container">
                            ${pkg.image_url ? `<img src="${pkg.image_url}" alt="Quote Summary">` : '<div class="p-5 text-center text-muted bg-white">No visual summary available</div>'}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('btnDownload').href = pkg.image_url || '#';
            document.getElementById('btnDownload').style.display = pkg.image_url ? 'inline-block' : 'none';

            $('#packageModal').modal('show');
        }

        init();
    </script>
</body>
</html>
