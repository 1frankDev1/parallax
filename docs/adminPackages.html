<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Admin Packages - Menutech</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/Diseño%20sin%20título%20(8).png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/badge.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <style>
        body { padding-bottom: 120px !important; }
        :root {
            --brand-color: #ff8c00;
            --brand-hover: #ffa733;
            --dark-gray: #1a1a1a;
            --bg-gray: #f8f9fa;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .navbar-custom {
            background: #111;
            padding: 1.2rem 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 1050;
        }
        .navbar-brand-text {
            color: white;
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
        }
        .sky-blue { color: #87CEEB; }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        /* Search Section */
        .search-container {
            max-width: 600px;
            margin: 0 auto 50px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 16px 25px 16px 60px;
            border-radius: 50px;
            border: 1px solid #ddd;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            font-weight: 600;
            outline: none;
            transition: 0.3s;
            font-size: 1.1rem;
        }
        .search-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 10px 30px rgba(255, 140, 0, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1.3rem;
        }

        /* Grid */
        #packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        /* Card System */
        .package-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eee;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .package-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        .card-header-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .client-info-group { flex: 1; }
        .client-name-display {
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
            color: #111;
            line-height: 1.2;
        }
        .tier-tag-small {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--brand-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            display: block;
        }

        .card-actions-top {
            display: flex;
            gap: 10px;
            margin-left: 15px;
        }
        .btn-mini-utility {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #f8f9fa;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-mini-utility i { font-size: 1.1rem; }
        .btn-mini-utility:hover {
            background: #eee;
            color: #111;
            border-color: #ddd;
        }
        .btn-mini-delete:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .pricing-stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .stat-chip {
            background: #fbfbfb;
            padding: 15px 10px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid #f0f0f0;
        }
        .stat-label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: #111;
        }
        .stat-val.orange { color: var(--brand-color); }

        .btn-full-details {
            background: #111;
            color: white !important;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-weight: 800;
            text-transform: uppercase;
            width: 100%;
            transition: 0.3s;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-full-details:hover {
            background: var(--brand-color);
            text-decoration: none;
            transform: scale(1.02);
        }

        /* MODAL REDESIGN */
        .modal-refined-content {
            border-radius: 35px;
            border: none;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
        }
        .modal-header-glass {
            background: white;
            padding: 30px 45px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header-glass h4 {
            font-weight: 800;
            margin: 0;
            font-size: 1.8rem;
            color: #111;
        }
        .btn-close-modal-pro {
            background: #f5f5f5;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            color: #333;
            font-size: 1.3rem;
        }
        .btn-close-modal-pro:hover {
            background: #e0e0e0;
            transform: scale(1.1);
        }

        .modal-body-pro {
            padding: 40px;
            background: white;
        }
        .sidebar-info-card {
            background: #f9f9f9;
            padding: 35px;
            border-radius: 30px;
            border: 1px solid #eee;
            height: 100%;
        }
        .modal-info-bit {
            margin-bottom: 30px;
        }
        .modal-info-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-info-title::before {
            content: '';
            width: 4px;
            height: 15px;
            background: var(--brand-color);
            border-radius: 2px;
        }
        .modal-main-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111;
        }
        .modal-price-hero {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--brand-color);
            line-height: 1;
        }
        .service-pill-mini {
            display: inline-block;
            background: white;
            border: 1px solid #eee;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            margin: 0 10px 10px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .image-display-frame {
            background: #f0f0f0;
            border-radius: 30px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            min-height: 600px;
            box-shadow: inset 0 5px 30px rgba(0,0,0,0.05);
            position: relative;
        }
        .image-display-frame img {
            max-width: 100%;
            max-height: 800px;
            object-fit: contain;
            border-radius: 20px;
            padding: 10px;
        }

        .modal-footer-glass {
            padding: 0 45px 45px;
            background: white;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }
        .btn-modal-cancel {
            background: #f0f0f0;
            color: #555;
            border: none;
            padding: 18px 40px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        .btn-modal-cancel:hover {
            background: #e0e0e0;
            color: #111;
        }
        .btn-modal-asset {
            background: var(--brand-color);
            color: white !important;
            border: none;
            padding: 18px 40px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(255, 140, 0, 0.25);
            text-decoration: none !important;
            display: inline-block;
            font-size: 1rem;
        }
        .btn-modal-asset:hover {
            background: var(--brand-hover);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(255, 140, 0, 0.4);
        }

        .empty-state-card {
            text-align: center;
            padding: 100px 20px;
            background: white;
            border-radius: 40px;
            color: #ccc;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <!-- ICONO Y BADGE (pildora) -->
    <img id="login-icon" class="login-icon" src="./assets/img/user.svg">
    <div id="user-badge" class="user-badge hidden" style="position: fixed;">
        <div id="badge-username"></div>
        <div id="badge-role"></div>
    </div>
    <div id="badge-menu" class="hidden">
        <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
    </div>

    <!-- TU DRAWER -->
    <menutech-drawer id="main-drawer" class="hidden"></menutech-drawer>

  <!-- NAVBAR NEOMÓRFICO INFERIOR -->
<div class="neo-nav-container">
    <button id="neoNavBack" class="neo-nav-btn">
        <svg viewBox="0 0 24 24" class="neo-nav-icon">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2"
                  fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <button id="neoNavHome" class="neo-nav-btn">
        <svg viewBox="0 0 24 24" class="neo-nav-icon">
            <path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4H9v4a2
                     2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                  stroke="currentColor" stroke-width="2" fill="none"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
</div>
  <menutech-themes></menutech-themes>
  <menutech-chatbot></menutech-chatbot>

    <div class="dashboard-container">
        <div class="header-section">
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search Client / Restaurant Name...">
        </div>

        <div id="packages-grid">
            <!-- Loading Spinner -->
            <div class="col-12 text-center p-5">
                <div class="spinner-border" style="color: var(--brand-color); width: 4rem; height: 4rem;" role="status"></div>
            </div>
        </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-animate/1.1.0/tinyanimate.min.js"></script>
    <script src="./assets/js/badge.js"></script>
    <script src="https://menutech.xyz/menutechUI.min.js"></script>
    <script src="./assets/js/renderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  // Botón Atrás
  const neoNavBack = document.getElementById("neoNavBack");
  if (neoNavBack) {
      neoNavBack.addEventListener("click", () => {
          if (window.history.length > 1) window.history.back();
      });
  }

  // Botón Inicio
  const neoNavHome = document.getElementById("neoNavHome");
  if (neoNavHome) {
      neoNavHome.addEventListener("click", () => {
          window.location.href = "index.html"; // Cambia por tu ruta principal
      });
  }
</script>
    <script type="module">
        import { supabase } from "./assets/js/supabase.js";
        let quoteStore = [];

        async function init() {
            fetchData();
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                renderCards(quoteStore.filter(p => p.client_name.toLowerCase().includes(term)));
            });
        }

        async function fetchData() {
            try {
                const { data, error } = await supabase.from('pricing_packages').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                quoteStore = data;
                renderCards(data);
            } catch (err) {
                document.getElementById('packages-grid').innerHTML = `<div class="alert alert-danger col-12">Error: ${err.message}</div>`;
            }
        }

        function renderCards(pkgs) {
            const container = document.getElementById('packages-grid');
            if (pkgs.length === 0) {
                container.innerHTML = `<div class="empty-state-card"><i class="fas fa-box-open fa-4x mb-4"></i><h3>No Packages Available</h3></div>`;
                return;
            }

            container.innerHTML = pkgs.map(p => `
                <div class="package-card">
                    <div class="card-header-main">
                        <div class="client-info-group">
                            <h4 class="client-name-text" style="font-weight: 800; font-size: 1.5rem; margin: 0; color: #111;">${p.client_name}</h4>
                            <div style="display:flex; gap: 10px; align-items: center; margin-top: 4px;">
                                <span class="tier-tag-small">${p.package_type || (p.services && p.services.length > 0 ? p.services[0].tier : 'Starter')}</span>
                                ${p.closer ? `<span class="badge badge-info" style="font-size: 0.65rem; text-transform: uppercase;">${p.closer}</span>` : ''}
                                ${p.services && p.services.some(s => s.is_free_monthly) ? `<span class="badge badge-success" style="font-size: 0.65rem; text-transform: uppercase; background-color: #28a745;">1 FREE MONTH</span>` : ''}
                            </div>
                            <div class="date-info" style="font-size: 0.8rem; color: #999; margin-top: 5px;"><i class="far fa-calendar-alt"></i> ${new Date(p.created_at).toLocaleDateString()}</div>
                        </div>
                        <div class="card-actions-top">
                            <div class="btn-mini-utility" onclick="onEditPackage('${p.id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </div>
                            <div class="btn-mini-utility btn-mini-delete" onclick="onDeletePackage('${p.id}')" title="Delete">
                                <i class="fas fa-trash-alt"></i>
                            </div>
                        </div>
                    </div>

                    <div class="pricing-stats-row">
                        <div class="stat-chip" style="position: relative;">
                            <span class="stat-label">${p.discount_setup > 0 ? 'Setup (Discounted)' : 'Setup'}</span>
                            <span class="stat-val">$${p.total_setup.toLocaleString()}</span>
                            ${p.discount_setup > 0 ? `<span style="position: absolute; top: -10px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; font-weight: 800; transform: rotate(15deg); border: 1px solid white;">-${p.discount_setup}%</span>` : ''}
                        </div>
                        <div class="stat-chip" style="position: relative;">
                            <span class="stat-label">${p.discount_monthly > 0 ? 'Monthly (Discounted)' : 'Monthly'}</span>
                            <span class="stat-val orange">$${p.total_monthly.toLocaleString()}</span>
                            ${p.discount_monthly > 0 ? `<span style="position: absolute; top: -10px; right: -5px; background: red; color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 4px; font-weight: 800; transform: rotate(15deg); border: 1px solid white;">-${p.discount_monthly}%</span>` : ''}
                        </div>
                    </div>

                    <button class="btn-full-details" onclick="triggerDetails('${p.id}')">
                        <span>Open Package Summary</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            `).join('');
        }

        window.triggerDetails = function(id) {
            const p = quoteStore.find(x => x.id === id);
            if (!p) return;

            if (!p.image_url) {
                Swal.fire('Error', 'No image asset found for this package', 'error');
                return;
            }

            Swal.fire({
                imageUrl: p.image_url,
                imageAlt: 'Package Quote',
                width: '600px',
                imageWidth: 600,
                imageHeight: 600,
                padding: '0',
                background: '#fff',
                showConfirmButton: false,
                showCloseButton: true,
                html: `
                    <div style="padding: 20px; display:flex; gap:10px; justify-content:center; background: #fff; border-radius: 0 0 35px 35px;">
                        <button onclick="copyToClipboard('${p.image_url}')" class="btn-modal-asset" style="padding:10px 20px; font-size:0.9rem;">
                            <i class="fas fa-link mr-2"></i> Copy Link
                        </button>
                        <a href="${p.image_url}" download="quote_${p.client_name}.png" target="_blank" class="btn-modal-asset" style="padding:10px 20px; font-size:0.9rem; background:#111;">
                            <i class="fas fa-download mr-2"></i> Download
                        </a>
                    </div>
                `,
                customClass: {
                    popup: 'modal-refined-content',
                    image: 'img-fluid'
                }
            });
        }

        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'Link Copied',
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 2000
                });
            });
        }

        window.onDeletePackage = async function(id) {
            const confirm = await Swal.fire({
                title: 'Confirm Deletion',
                text: "Are you sure you want to delete this quote record permanently?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff8c00',
                cancelButtonColor: '#aaa',
                confirmButtonText: 'Yes, Delete It',
                borderRadius: '30px',
                padding: '2rem'
            });

            if (confirm.isConfirmed) {
                try {
                    const { error } = await supabase.from('pricing_packages').delete().match({ id: id });
                    if (error) throw error;

                    Swal.fire({ icon: 'success', title: 'Deleted Successfully', showConfirmButton: false, timer: 1500 });

                    // Force refresh store and UI
                    await fetchData();
                } catch (err) {
                    console.error('Delete error:', err);
                    Swal.fire('Error', err.message, 'error');
                }
            }
        }

        window.onEditPackage = (id) => window.location.href = `pricing.html?edit=${id}`;

        init();
    </script>
</body>
</html>
