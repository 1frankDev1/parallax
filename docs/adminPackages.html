<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Admin Packages - Menutech</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/Diseño%20sin%20título%20(8).png">
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <style>
        :root {
            --brand-color: #ff8c00;
            --brand-hover: #ffa733;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f0f2f5;
            color: #2c3e50;
            min-height: 100vh;
        }
        .navbar-custom {
            background: #161b22;
            padding: 15px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand-text {
            color: white;
            font-weight: 800;
            font-size: 1.5rem;
            margin: 0;
        }
        .sky-blue { color: #87CEEB; }

        .main-content {
            padding: 40px 0;
        }

        .page-title-section {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .search-wrapper {
            position: relative;
            max-width: 400px;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid #ddd;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: var(--brand-color);
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        /* Glass Cards */
        .package-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid #f0f0f0;
        }
        .package-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .package-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 45px rgba(255, 140, 0, 0.12);
            border-color: rgba(255, 140, 0, 0.3);
        }

        .card-accent {
            height: 6px;
            background: linear-gradient(90deg, var(--brand-color), var(--brand-hover));
        }

        .card-header-custom {
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-client-name {
            font-weight: 800;
            font-size: 1.4rem;
            color: #1a1a1a;
            margin: 0;
            line-height: 1.2;
        }
        .package-badge {
            background: #fdf2e9;
            color: #ff8c00;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 8px;
        }

        .card-date {
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
            margin-top: 5px;
        }

        .card-body-custom {
            padding: 0 25px 25px;
            flex-grow: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-value {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--brand-color);
        }

        .card-footer-actions {
            padding: 0 25px 25px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
        }
        .btn-view {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-view:hover {
            background: var(--brand-color);
            color: white;
        }
        .btn-circle {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
            background: white;
            color: #666;
            transition: all 0.3s;
        }
        .btn-circle:hover {
            background: #f8f9fa;
            color: #1a1a1a;
            border-color: #ddd;
        }
        .btn-delete:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fca5a5;
        }

        /* Modal Enhancement */
        .modal-glass {
            background: #fff;
            border-radius: 30px !important;
            border: none !important;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
        }
        .modal-header-glass {
            background: #fff;
            color: #1a1a1a;
            border-bottom: 1px solid #f0f0f0;
            padding: 25px 35px;
        }
        .modal-body-glass {
            padding: 30px;
        }
        .detail-card {
            background: #f9f9f9;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .service-pill {
            display: inline-block;
            background: white;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .service-pill.waived {
            border-color: #27ae60;
            color: #27ae60;
        }

        .quote-img-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            background: white;
            line-height: 0;
        }
        .quote-img-container img {
            width: 100%;
            transition: transform 0.5s;
        }
        .quote-img-container:hover img {
            transform: scale(1.05);
        }

        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 4rem;
            color: #eee;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <div class="container text-center">
            <h1 class="navbar-brand-text">Administracion <span class="sky-blue">Circle Center</span></h1>
        </div>
    </nav>

    <div class="container main-content">
        <div class="page-title-section">
            <div>
                <h2 style="font-weight: 800; margin: 0;">Packages Dashboard</h2>
                <p class="text-muted mb-0">Management of generated dynamic quotes</p>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Search by name or restaurant...">
            </div>
        </div>

        <div id="packages-container" class="row">
            <!-- Loading Spinner -->
            <div class="col-12 text-center p-5">
                <div class="spinner-border" style="color: var(--brand-color)" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="packageModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content modal-glass">
                <div class="modal-header modal-header-glass">
                    <h5 class="modal-title" id="modalClientName" style="font-weight: 800;">Package Details</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body modal-body-glass" id="modalContent">
                    <!-- Dynamic Content -->
                </div>
                <div class="modal-footer border-0 pb-4 pr-4">
                    <button type="button" class="btn btn-link text-muted" data-dismiss="modal">Close</button>
                    <a id="btnDownload" href="#" target="_blank" class="btn btn-primary" style="background: var(--brand-color); border: none; border-radius: 12px; padding: 12px 25px; font-weight: 700;">View Original Asset</a>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="./assets/js/renderer.js"></script>

    <script type="module">
        import { supabase } from "./assets/js/supabase.js";
        let allPackages = [];

        async function init() {
            loadPackages();

            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = allPackages.filter(p => p.client_name.toLowerCase().includes(term));
                renderPackages(filtered);
            });
        }

        async function loadPackages() {
            try {
                const { data, error } = await supabase
                    .from('pricing_packages')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allPackages = data;
                renderPackages(data);
            } catch (err) {
                console.error('Error loading packages:', err);
                document.getElementById('packages-container').innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="alert alert-danger d-inline-block px-5" style="border-radius: 20px;">
                           <i class="fas fa-exclamation-triangle mr-2"></i> Error al cargar datos: ${err.message}
                        </div>
                    </div>
                `;
            }
        }

        function renderPackages(packages) {
            const container = document.getElementById('packages-container');
            if (packages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3>No packages found</h3>
                        <p class="text-muted">Once you create a package in the builder, it will appear here.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = packages.map(p => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="package-card">
                        <div class="card-accent"></div>
                        <div class="card-header-custom">
                            <div style="flex: 1;">
                                <span class="package-badge">${p.package_type || 'Custom'}</span>
                                <h4 class="card-client-name text-truncate" style="max-width: 220px;">${p.client_name}</h4>
                                <div class="card-date"><i class="far fa-calendar-alt mr-1"></i> ${new Date(p.created_at).toLocaleDateString()}</div>
                            </div>
                            <div style="background: #f8f9fa; width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #1a1a1a; border: 1px solid #eee;">
                                <i class="fas fa-file-invoice-dollar"></i>
                            </div>
                        </div>
                        <div class="card-body-custom">
                            <div class="stats-grid">
                                <div class="stat-box">
                                    <span class="stat-label">Setup</span>
                                    <span class="stat-value">$${p.total_setup.toLocaleString()}</span>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-label">Monthly</span>
                                    <span class="stat-value">$${p.total_monthly.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer-actions">
                            <button class="btn-view" onclick="viewDetails('${p.id}')">
                                <span>DETAILS</span>
                                <i class="fas fa-chevron-right"></i>
                            </button>
                            <button class="btn-circle" onclick="editPackage('${p.id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-circle btn-delete" onclick="deletePackage('${p.id}')" title="Delete">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.viewDetails = function(id) {
            const pkg = allPackages.find(p => p.id === id);
            if (!pkg) return;

            document.getElementById('modalClientName').innerHTML = `
                <div class="d-flex align-items-center">
                    <div style="background: var(--brand-color); width: 10px; height: 30px; border-radius: 5px; margin-right: 15px;"></div>
                    <div>
                        <h4 style="margin: 0; font-weight: 800;">Package Details</h4>
                        <p class="text-muted mb-0" style="font-size: 0.9rem; font-weight: 500;">${pkg.client_name} - ${pkg.package_type || 'Custom'}</p>
                    </div>
                </div>
            `;

            let servicesHtml = '';
            pkg.services.forEach(s => {
                servicesHtml += `<span class="service-pill ${s.is_free ? 'waived' : ''}">${s.name}</span>`;
            });

            document.getElementById('modalContent').innerHTML = `
                <div class="row">
                    <div class="col-lg-4">
                        <div class="detail-card h-100" style="background: #fbfbfb; border: 1px solid #f0f0f0;">
                            <h5 style="font-weight: 800; margin-bottom: 25px; font-size: 1.1rem;">Quote Overview</h5>

                            <div class="mb-4">
                                <label class="text-muted d-block small font-weight-bold text-uppercase mb-1">Setup</label>
                                <div style="font-size: 1.8rem; font-weight: 800; color: #1a1a1a;">$${pkg.total_setup.toLocaleString()}</div>
                            </div>

                            <div class="mb-4">
                                <label class="text-muted d-block small font-weight-bold text-uppercase mb-1">Monthly</label>
                                <div style="font-size: 1.8rem; font-weight: 800; color: var(--brand-color);">$${pkg.total_monthly.toLocaleString()}</div>
                            </div>

                            <div class="mb-4 pt-3 border-top">
                                <label class="text-muted d-block small font-weight-bold text-uppercase mb-2">Services Included</label>
                                <div class="d-flex flex-wrap">
                                    ${servicesHtml}
                                </div>
                            </div>

                            <div class="mt-auto">
                                <p class="text-muted small"><i class="far fa-clock mr-1"></i> Generated on ${new Date(pkg.created_at).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="h-100 d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="font-weight-800 mb-0">Visual Quote Preview</h6>
                                <a href="${pkg.image_url}" target="_blank" class="btn btn-sm btn-light" style="border-radius: 8px; font-weight: 600;">
                                    <i class="fas fa-external-link-alt mr-1"></i> Full View
                                </a>
                            </div>
                            <div class="quote-img-container flex-grow-1 d-flex align-items-center justify-content-center" style="background: #f0f0f0; border-radius: 20px; min-height: 400px;">
                                ${pkg.image_url ? `<img src="${pkg.image_url}" style="max-height: 600px; object-fit: contain; width: 100%; border-radius: 20px;">` : '<div class="p-5 text-center text-muted">No visual summary available</div>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('btnDownload').href = pkg.image_url || '#';
            document.getElementById('btnDownload').style.display = pkg.image_url ? 'inline-block' : 'none';

            $('#packageModal').modal('show');
        }

        window.deletePackage = async function(id) {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "This package will be permanently deleted.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff8c00',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, delete it!',
                background: '#fff',
                borderRadius: '20px'
            });

            if (result.isConfirmed) {
                try {
                    const { error } = await supabase
                        .from('pricing_packages')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    Swal.fire({
                        icon: 'success',
                        title: 'Deleted!',
                        text: 'Package has been removed.',
                        showConfirmButton: false,
                        timer: 1500
                    });

                    loadPackages();
                } catch (err) {
                    Swal.fire('Error', err.message, 'error');
                }
            }
        }

        window.editPackage = function(id) {
            // Since we don't have a full edit state management yet,
            // we'll just show a notification or redirect to builder.
            // For now, let's just alert.
            Swal.fire({
                title: 'Edit Package',
                text: 'This will load the package data back into the builder. Redirecting...',
                icon: 'info',
                timer: 2000,
                showConfirmButton: false
            });
            setTimeout(() => {
                window.location.href = `pricing.html?edit=${id}`;
            }, 2000);
        }

        init();
    </script>
</body>
</html>
