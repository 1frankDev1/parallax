<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Menutech</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/Diseño%20sin%20título%20(8).png">
    <link rel="stylesheet" href="./assets/css/badge.css">
    <style>
        :root {
            --brand-color: #ff8c00;
            --brand-hover: #ffa733;
            --brand-glow: rgba(255, 140, 0, 0.4);
            --bg-dark: #0d1117;
            --card-dark: #161b22;
            --border-color: #30363d;
            --text-light: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c2c2c;
            background-image: radial-gradient(circle at center, #3d3d3d 0%, #1a1a1a 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 180px;
            height: auto;
        }

        .auth-tabs {
            display: flex;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background-color: var(--brand-color);
            color: #ffffff;
            box-shadow: 0 2px 8px var(--brand-glow);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 14px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--brand-color);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.25s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--brand-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            border-color: var(--brand-color);
            color: var(--brand-color);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        .status-msg.error {
            color: #ff4d4d;
        }

        .status-msg.success {
            color: #2ea44f;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--brand-color);
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        .badge-info {
            display: inline-block;
            background: rgba(255, 140, 0, 0.15);
            color: var(--brand-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="https://menutech.services/assets/img/logomt.png" alt="Menutech Logo">
        </div>

        <!-- TABS DE AUTENTICACIÓN -->
        <div class="auth-tabs">
            <button id="tab-basic" class="tab-btn active" onclick="switchTab('basic')">Login Básico</button>
            <button id="tab-supabase" class="tab-btn" onclick="switchTab('supabase')">Supabase Auth</button>
        </div>

        <!-- CONTENIDO: LOGIN BÁSICO -->
        <div id="content-basic" class="tab-content active">
            <form id="form-basic-login" onsubmit="handleBasicLogin(event)">
                <div class="form-group">
                    <label for="basic-username">Nombre / Usuario</label>
                    <input type="text" id="basic-username" class="form-control" placeholder="Ej. Admin" required>
                </div>
                <div class="form-group">
                    <label for="basic-password">Contraseña</label>
                    <input type="password" id="basic-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-basic-submit" class="btn-submit">Entrar (Básico)</button>
            </form>
            <div id="status-basic" class="status-msg"></div>
        </div>

        <!-- CONTENIDO: SUPABASE AUTH -->
        <div id="content-supabase" class="tab-content">
            <form id="form-supabase-login" onsubmit="handleSupabaseLogin(event)">
                <div class="form-group">
                    <label for="supa-email">Correo Electrónico (Email)</label>
                    <input type="email" id="supa-email" class="form-control" placeholder="usuario@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="supa-password">Contraseña</label>
                    <input type="password" id="supa-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-supa-submit" class="btn-submit">Entrar con Supabase</button>
            </form>
            <button type="button" class="btn-secondary" onclick="openRegisterModal()">Crear Cuenta / Registrarse</button>
            <div id="status-supabase" class="status-msg"></div>
        </div>
    </div>

    <!-- MODAL DE REGISTRO CON SUPABASE AUTH -->
    <div id="register-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Registro Supabase Auth</h3>
                <button class="close-btn" onclick="closeRegisterModal()">✕</button>
            </div>
            <form id="form-supabase-register" onsubmit="handleSupabaseRegister(event)">
                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="correo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
                    <span class="badge-info">Mínimo 6 caracteres. Se enviará un correo de confirmación.</span>
                </div>
                <button type="submit" id="btn-reg-submit" class="btn-submit">Registrarse</button>
            </form>
            <div id="status-register" class="status-msg"></div>
        </div>
    </div>

    <!-- Cargar cliente Supabase JS -->
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js";

        const SUPABASE_URL = "https://ojpyfjgkffmzwvukjagf.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qcHlmamdrZmZtend2dWtqYWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxNDIwMzYsImV4cCI6MjA3OTcxODAzNn0.dlVYmoMumBse_O1PLBx0FeNITqY4YktefD6l_uonSgo";

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.mtSupabaseClient = supabase;

        // Verificar sesión activa
        window.addEventListener("DOMContentLoaded", async () => {
            const savedSession = localStorage.getItem("session");
            if (savedSession) {
                // Redirigir si ya existe sesión
                window.location.href = "index.html";
                return;
            }

            // Comprobar si hay sesión en Supabase Auth
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                const userSession = {
                    user: session.user.email,
                    role: session.user.user_metadata?.role || "CS",
                    isSupabaseAuth: true,
                    authId: session.user.id
                };
                localStorage.setItem("session", JSON.stringify(userSession));
                window.location.href = "index.html";
            }
        });
    </script>

    <script>
        // Cambio entre pestañas
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'basic') {
                document.getElementById('tab-basic').classList.add('active');
                document.getElementById('content-basic').classList.add('active');
            } else {
                document.getElementById('tab-supabase').classList.add('active');
                document.getElementById('content-supabase').classList.add('active');
            }
        }

        // --- LOGIN BÁSICO (Temporal) ---
        async function handleBasicLogin(e) {
            e.preventDefault();
            const username = document.getElementById("basic-username").value.trim();
            const password = document.getElementById("basic-password").value.trim();
            const statusEl = document.getElementById("status-basic");
            const btnSubmit = document.getElementById("btn-basic-submit");

            if (!username || !password) {
                statusEl.className = "status-msg error";
                statusEl.innerText = "Por favor completa todos los campos";
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Verificando...";
            statusEl.innerText = "";

            try {
                const client = window.mtSupabaseClient || window.mtSupabase;
                if (!client) throw new Error("No se pudo conectar a la base de datos");

                let { data, error } = await client
                    .from("usuarios")
                    .select("username, password, role")
                    .eq("username", username)
                    .maybeSingle();

                if ((!data || error) && username) {
                    const res = await client
                        .from("usuarios")
                        .select("username, password, role")
                        .ilike("username", username);
                    if (res && res.data && res.data.length === 1) {
                        data = res.data[0];
                        error = null;
                    } else if (res && res.data && res.data.length > 1) {
                        const found = res.data.find(r => String(r.username).trim().toLowerCase() === username.toLowerCase());
                        if (found) { data = found; error = null; }
                    }
                }

                if (error || !data || String(data.password).trim() !== password) {
                    statusEl.className = "status-msg error";
                    statusEl.innerText = "Usuario o contraseña incorrectos";
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Entrar (Básico)";
                    return;
                }

                // Guardar sesión estándar
                const sessionObj = {
                    user: data.username,
                    role: data.role
                };
                localStorage.setItem("session", JSON.stringify(sessionObj));

                statusEl.className = "status-msg success";
                statusEl.innerText = "✔ Inicio correcto. Redirigiendo...";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);

            } catch (err) {
                console.error("Error en login básico:", err);
                statusEl.className = "status-msg error";
                statusEl.innerText = "Error al intentar iniciar sesión";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Entrar (Básico)";
            }
        }

        // --- SUPABASE AUTH LOGIN ---
        async function handleSupabaseLogin(e) {
            e.preventDefault();
            const email = document.getElementById("supa-email").value.trim();
            const password = document.getElementById("supa-password").value.trim();
            const statusEl = document.getElementById("status-supabase");
            const btnSubmit = document.getElementById("btn-supa-submit");

            if (!email || !password) {
                statusEl.className = "status-msg error";
                statusEl.innerText = "Por favor completa todos los campos";
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Autenticando...";
            statusEl.innerText = "";

            try {
                const client = window.mtSupabaseClient || window.mtSupabase;
                if (!client) throw new Error("Cliente de Supabase no disponible");

                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    statusEl.className = "status-msg error";
                    statusEl.innerText = error.message || "Error de autenticación con Supabase";
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Entrar con Supabase";
                    return;
                }

                // Obtener rol del usuario si existe en la tabla usuarios o metadata
                let userRole = data.user.user_metadata?.role || "CS";

                // Intento opcional de emparejar con la tabla usuarios
                const { data: userData } = await client
                    .from("usuarios")
                    .select("role")
                    .eq("username", email)
                    .maybeSingle();

                if (userData && userData.role) {
                    userRole = userData.role;
                }

                const userSession = {
                    user: data.user.email,
                    role: userRole,
                    isSupabaseAuth: true,
                    authId: data.user.id
                };

                localStorage.setItem("session", JSON.stringify(userSession));

                statusEl.className = "status-msg success";
                statusEl.innerText = "✔ Autenticación exitosa. Redirigiendo...";
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);

            } catch (err) {
                console.error("Error en Supabase Auth login:", err);
                statusEl.className = "status-msg error";
                statusEl.innerText = "Ocurrió un error inesperado";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Entrar con Supabase";
            }
        }

        // --- MODAL Y REGISTRO CON SUPABASE AUTH ---
        function openRegisterModal() {
            document.getElementById("register-modal").classList.add("visible");
            document.getElementById("status-register").innerText = "";
        }

        function closeRegisterModal() {
            document.getElementById("register-modal").classList.remove("visible");
        }

        async function handleSupabaseRegister(e) {
            e.preventDefault();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const statusEl = document.getElementById("status-register");
            const btnSubmit = document.getElementById("btn-reg-submit");

            if (!email || !password) {
                statusEl.className = "status-msg error";
                statusEl.innerText = "Ingresa correo y contraseña";
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Registrando...";
            statusEl.innerText = "";

            try {
                const client = window.mtSupabaseClient || window.mtSupabase;
                if (!client) throw new Error("Cliente de Supabase no disponible");

                const { data, error } = await client.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    statusEl.className = "status-msg error";
                    statusEl.innerText = error.message;
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Registrarse";
                    return;
                }

                statusEl.className = "status-msg success";
                statusEl.innerText = "✔ Registro exitoso. Se ha enviado un correo de confirmación. Por favor revisa tu bandeja de entrada para verificar la cuenta.";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Registrarse";

            } catch (err) {
                console.error("Error en registro Supabase Auth:", err);
                statusEl.className = "status-msg error";
                statusEl.innerText = "Error durante el registro";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Registrarse";
            }
        }
    </script>
</body>
</html>
