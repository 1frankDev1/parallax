<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Pricing - Menutech</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/Diseño%20sin%20título%20(8).png">
    <link rel="stylesheet" href="./assets/css/badge.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <style>
        :root {
            --brand-color: #ff8c00;
            --brand-hover: #ffa733;
            --dark-bg: #2c2c2c;
            --card-bg: #3d3d3d;
            --text-color: #f0f0f0;
            --accent-color: #00bcd4;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 150px;
            min-height: 100vh;
        }

        .container-fluid {
            max-width: 1400px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin: 40px 0;
            font-weight: 800;
        }

        .admin-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-card h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-control-custom {
            background: #444;
            border: 1px solid #555;
            color: #fff;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
        }

        .form-control-custom:focus {
            border-color: var(--brand-color);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
        }

        .btn-custom {
            background: var(--brand-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: var(--brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3);
        }

        .btn-accent {
            background: var(--accent-color);
        }

        .btn-accent:hover {
            background: #00d2eb;
            box-shadow: 0 5px 15px rgba(0, 188, 212, 0.3);
        }

        .btn-danger-custom {
            background: #f44336;
        }

        .btn-danger-custom:hover {
            background: #d32f2f;
        }

        /* Services Grid/Table */
        .services-table-container {
            overflow-x: auto;
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .table-custom th {
            color: var(--accent-color) !important;
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border: none;
        }

        .table-custom tr {
            background: rgba(255,255,255,0.03);
            transition: 0.3s;
        }

        .table-custom tr:hover {
            background: rgba(255,255,255,0.07);
        }

        .table-custom td {
            padding: 15px;
            vertical-align: middle;
            border: none;
            color: #fff !important;
        }

        .table-custom tr td:first-child { border-radius: 15px 0 0 15px; }
        .table-custom tr td:last-child { border-radius: 0 15px 15px 0; }

        .service-img-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #555;
        }

        /* Preset Selectors */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .preset-column {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .preset-column h3 {
            font-size: 1.1rem;
            color: var(--brand-color);
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }

        .service-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            transition: 0.2s;
            cursor: pointer;
        }

        .service-checkbox-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .service-checkbox-item input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        /* Global Settings */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: #444;
            border: 1px solid #555;
            border-radius: 10px;
            min-height: 50px;
        }

        .tag-pill {
            background: var(--brand-color);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .tag-pill i {
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* Glassmorphism SweetAlert */
        .swal2-glass {
            background: rgba(30, 32, 48, 0.95) !important;
            backdrop-filter: blur(10px) !important;
            color: #f0f0f0 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 20px !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5) !important;
        }
    </style>
</head>
<body>
    <menutech-navweb></menutech-navweb>
    <menutech-drawer id="main-drawer" class="hidden"></menutech-drawer>
    <menutech-themes></menutech-themes>
    <menutech-chatbot></menutech-chatbot>
    <menutech-tools></menutech-tools>

    <img id="login-icon" class="login-icon" src="./assets/img/user.svg">
    <div id="user-badge" class="user-badge hidden" style="position: fixed;">
        <div id="badge-username"></div>
        <div id="badge-role"></div>
    </div>
    <div id="badge-menu" class="hidden">
        <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
    </div>

    <div class="container-fluid">
        <h1>Admin Pricing Dashboard</h1>

        <div class="row">
            <!-- Global Settings & Presets -->
            <div class="col-xl-4">
                <div class="admin-card">
                    <h2><i class="fas fa-cog"></i> Global Settings</h2>
                    <div class="form-group">
                        <label>Specialists / Closers</label>
                        <div class="tag-input-container" id="specialists-container">
                            <!-- Tags will appear here -->
                        </div>
                        <div class="input-group mt-2">
                            <input type="text" id="new-specialist" class="form-control-custom" placeholder="Add specialist name...">
                            <div class="input-group-append">
                                <button class="btn-custom" id="btn-add-specialist" style="border-radius: 0 10px 10px 0;">Add</button>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-6">
                            <div class="form-group">
                                <label>Min Discount %</label>
                                <input type="number" id="min-discount" class="form-control-custom" value="1">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label>Max Discount %</label>
                                <input type="number" id="max-discount" class="form-control-custom" value="18">
                            </div>
                        </div>
                    </div>

                    <button class="btn-custom w-100 mt-3" id="btn-save-settings">Save Global Settings</button>
                </div>

                <div class="admin-card">
                    <h2><i class="fas fa-layer-group"></i> Tier Presets</h2>
                    <p style="font-size: 0.8rem; color: #888; margin-top: -15px; margin-bottom: 20px;">Select which services are included in each preset tier.</p>

                    <div class="preset-column mb-3">
                        <h3 style="color: #4db8ff;">Starter</h3>
                        <div id="starter-services-list" class="preset-service-checklist">
                            <!-- Checkboxes here -->
                        </div>
                    </div>

                    <div class="preset-column mb-3">
                        <h3 style="color: #ffcc00;">Premium</h3>
                        <div id="premium-services-list" class="preset-service-checklist">
                            <!-- Checkboxes here -->
                        </div>
                    </div>

                    <div class="preset-column">
                        <h3 style="color: #ff4d4d;">Deluxe</h3>
                        <div id="deluxe-services-list" class="preset-service-checklist">
                            <!-- Checkboxes here -->
                        </div>
                    </div>

                    <button class="btn-custom w-100 mt-4 btn-accent" id="btn-save-presets">Update Presets</button>
                </div>
            </div>

            <!-- Services Management -->
            <div class="col-xl-8">
                <div class="admin-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="m-0"><i class="fas fa-concierge-bell"></i> Services Catalog</h2>
                        <button class="btn-custom btn-accent" id="btn-new-service"><i class="fas fa-plus"></i> New Service</button>
                    </div>

                    <div class="services-table-container">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>Service</th>
                                    <th>Setup</th>
                                    <th>Monthly</th>
                                    <th>Image</th>
                                    <th style="width: 150px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="services-table-body">
                                <!-- Services loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Modal -->
    <div class="modal fade" id="serviceModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content admin-card" style="margin-bottom: 0; border: none;">
                <div class="modal-header border-0">
                    <h2 id="modal-title"><i class="fas fa-edit"></i> Edit Service</h2>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="service-form">
                        <input type="hidden" id="service-id-internal">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Unique ID (slug)</label>
                                    <input type="text" id="service-id-input" class="form-control-custom" placeholder="e.g. online_orders" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Display Name</label>
                                    <input type="text" id="service-name-input" class="form-control-custom" placeholder="e.g. Online Orders" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Setup Fee ($)</label>
                                    <input type="number" step="0.01" id="service-setup-input" class="form-control-custom" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Monthly Fee ($)</label>
                                    <input type="number" step="0.01" id="service-monthly-input" class="form-control-custom" placeholder="0.00" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="service-image-input" class="form-control-custom" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="service-description-input" class="form-control-custom" style="height: 100px;"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Direct Link URL (Title Link)</label>
                            <input type="text" id="service-link-input" class="form-control-custom" placeholder="https://...">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn-custom bg-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-custom" id="btn-save-service-modal">Save Service</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Neomorphic Navigation -->
    <div class="neo-nav-container">
        <button id="neoNavBack" class="neo-nav-btn">
            <svg viewBox="0 0 24 24" class="neo-nav-icon">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="neoNavHome" class="neo-nav-btn">
            <svg viewBox="0 0 24 24" class="neo-nav-icon">
                <path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4H9v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-animate/1.1.0/tinyanimate.min.js"></script>
    <script src="./assets/js/badge.js"></script>
    <script src="https://menutech.xyz/menutechUI.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/renderer.js"></script>
    <script type="module" src="./assets/js/adminPricing.js"></script>
    <script>
        // Basic Navigation
        document.getElementById("neoNavBack").onclick = () => window.history.back();
        document.getElementById("neoNavHome").onclick = () => window.location.href = "index.html";
    </script>
</body>
</html>
