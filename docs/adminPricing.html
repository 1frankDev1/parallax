<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Pricing - Menutech</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/img/Diseño%20sin%20título%20(8).png">
    <link rel="stylesheet" href="./assets/css/badge.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700,800" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <style>
        :root {
            --brand-color: #ff8c00;
            --brand-hover: #ffa733;
            --dark-bg: #2c2c2c;
            --card-bg: #3d3d3d;
            --text-color: #ffffff; /* Letra blanca */
            --accent-color: #00bcd4;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: 80px; /* Space for the pill */
            padding-bottom: 150px;
            min-height: 100vh;
        }

        .container-fluid {
            max-width: 1400px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-card h2 {
            margin-top: 0;
            color: var(--brand-color); /* Títulos color naranja */
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Quitar iconos de los títulos (ya quitados en el JS/HTML below) */

        .form-group label {
            font-size: 0.85rem;
            color: #ddd; /* Letra más clara */
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-control-custom {
            background: #444;
            border: 1px solid #555;
            color: #fff;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
        }

        .form-control-custom:focus {
            border-color: var(--brand-color);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
        }

        .btn-custom {
            background: var(--brand-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: var(--brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3);
        }

        .btn-accent {
            background: var(--accent-color);
        }

        .btn-accent:hover {
            background: #00d2eb;
            box-shadow: 0 5px 15px rgba(0, 188, 212, 0.3);
        }

        .btn-danger-custom {
            background: #f44336;
        }

        .btn-danger-custom:hover {
            background: #d32f2f;
        }

        /* Services Grid/Table */
        .services-table-container {
            overflow-x: auto;
        }

        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .table-custom th {
            color: var(--brand-color) !important; /* Títulos naranja */
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border: none;
        }

        .table-custom tr {
            background: rgba(255,255,255,0.03);
            transition: 0.3s;
            border-radius: 15px;
        }

        .table-custom tr:hover {
            background: rgba(255,255,255,0.07);
        }

        .table-custom td {
            padding: 15px;
            vertical-align: middle;
            border: none;
            color: #fff !important; /* Letra blanca */
        }

        .table-custom tr td:first-child { border-radius: 15px 0 0 15px; }
        .table-custom tr td:last-child { border-radius: 0 15px 15px 0; }

        .service-img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #555;
        }

        /* Visual Preset Manager */
        .preset-selector-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .preset-tab-btn {
            background: #444;
            color: #888;
            border: 2px solid transparent;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .preset-tab-btn.active {
            background: var(--brand-color);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3);
        }

        .preset-tab-btn.active[data-tier="starter"] { background: #4db8ff; box-shadow: 0 5px 15px rgba(77, 184, 255, 0.3); }
        .preset-tab-btn.active[data-tier="premium"] { background: #ffcc00; box-shadow: 0 5px 15px rgba(255, 204, 0, 0.3); }
        .preset-tab-btn.active[data-tier="deluxe"] { background: #ff4d4d; box-shadow: 0 5px 15px rgba(255, 77, 77, 0.3); }

        .visual-services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            background: rgba(0,0,0,0.1);
            padding: 20px;
            border-radius: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .visual-service-item {
            background: #4a4a4a;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .visual-service-item.selected {
            border-color: var(--brand-color);
            background: rgba(255, 140, 0, 0.1);
        }

        .visual-service-item.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--brand-color);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            line-height: 20px;
            font-weight: 900;
        }

        .visual-service-item span {
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
        }

        /* Specialists / Tags */
        .tag-pill {
            background: var(--brand-color);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .tag-pill i {
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.7;
            transition: 0.2s;
        }

        .tag-pill i:hover { opacity: 1; }

        /* Neomorphic Navigation */
        .neo-nav-container {
            z-index: 10001;
        }
    </style>
</head>
<body>
    <menutech-navweb></menutech-navweb>
    <menutech-drawer id="main-drawer" class="hidden"></menutech-drawer>
    <menutech-themes></menutech-themes>
    <menutech-chatbot></menutech-chatbot>
    <menutech-tools></menutech-tools>

    <img id="login-icon" class="login-icon" src="./assets/img/user.svg">
    <div id="user-badge" class="user-badge hidden" style="position: fixed;">
        <div id="badge-username"></div>
        <div id="badge-role"></div>
    </div>
    <div id="badge-menu" class="hidden">
        <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
    </div>

    <div class="container-fluid">
        <!-- H1 Removido -->

        <div class="row">
            <!-- Global Settings -->
            <div class="col-xl-4">
                <div class="admin-card">
                    <h2>Global Settings</h2>
                    <div class="form-group">
                        <label>Specialists / Closers</label>
                        <div class="tag-input-container d-flex flex-wrap gap-2" id="specialists-container" style="gap: 10px;">
                            <!-- Tags will appear here -->
                        </div>
                        <div class="input-group mt-3">
                            <input type="text" id="new-specialist" class="form-control-custom" placeholder="Add specialist name...">
                            <div class="input-group-append">
                                <button class="btn-custom" id="btn-add-specialist" style="border-radius: 0 10px 10px 0;">Add</button>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-6">
                            <div class="form-group">
                                <label>Min Discount %</label>
                                <input type="number" id="min-discount" class="form-control-custom" value="1">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label>Max Discount %</label>
                                <input type="number" id="max-discount" class="form-control-custom" value="18">
                            </div>
                        </div>
                    </div>

                    <button class="btn-custom w-100 mt-3" id="btn-save-settings">Save Global Settings</button>
                </div>

                <div class="admin-card">
                    <h2>Tier Presets</h2>

                    <div class="preset-selector-tabs">
                        <button class="preset-tab-btn active" data-tier="starter">Starter</button>
                        <button class="preset-tab-btn" data-tier="premium">Premium</button>
                        <button class="preset-tab-btn" data-tier="deluxe">Deluxe</button>
                    </div>

                    <div class="visual-services-grid" id="visual-services-grid">
                        <!-- Visual service items loaded here -->
                    </div>

                    <button class="btn-custom w-100 mt-4 btn-accent" id="btn-save-presets">Update Selected Preset</button>
                </div>
            </div>

            <!-- Services Management -->
            <div class="col-xl-8">
                <div class="admin-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="m-0">Services Catalog</h2>
                        <button class="btn-custom btn-accent" id="btn-new-service">New Service</button>
                    </div>

                    <div class="services-table-container">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>Service</th>
                                    <th>Setup</th>
                                    <th>Monthly</th>
                                    <th>Image</th>
                                    <th style="width: 150px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="services-table-body">
                                <!-- Services loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Modal -->
    <div class="modal fade" id="serviceModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content admin-card" style="margin-bottom: 0; border: none; background: #333;">
                <div class="modal-header border-0">
                    <h2 id="modal-title" style="color: var(--brand-color);">Edit Service</h2>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" style="color: white;">
                    <form id="service-form">
                        <input type="hidden" id="service-id-internal">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Unique ID (slug)</label>
                                    <input type="text" id="service-id-input" class="form-control-custom" placeholder="e.g. online_orders" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Display Name</label>
                                    <input type="text" id="service-name-input" class="form-control-custom" placeholder="e.g. Online Orders" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Setup Fee ($)</label>
                                    <input type="number" step="0.01" id="service-setup-input" class="form-control-custom" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Monthly Fee ($)</label>
                                    <input type="number" step="0.01" id="service-monthly-input" class="form-control-custom" placeholder="0.00" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Title Img URL</label>
                            <input type="text" id="service-image-input" class="form-control-custom" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="service-description-input" class="form-control-custom" style="height: 100px;"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn-custom bg-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-custom" id="btn-save-service-modal">Save Service</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Neomorphic Navigation -->
    <div class="neo-nav-container">
        <button id="neoNavBack" class="neo-nav-btn">
            <svg viewBox="0 0 24 24" class="neo-nav-icon">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="neoNavHome" class="neo-nav-btn">
            <svg viewBox="0 0 24 24" class="neo-nav-icon">
                <path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4H9v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-animate/1.1.0/tinyanimate.min.js"></script>
    <script src="./assets/js/badge.js"></script>
    <script src="https://menutech.xyz/menutechUI.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/renderer.js"></script>
    <script type="module" src="./assets/js/adminPricing.js"></script>
    <script>
        // Basic Navigation
        document.getElementById("neoNavBack").onclick = () => window.history.back();
        document.getElementById("neoNavHome").onclick = () => window.location.href = "index.html";
    </script>
</body>
</html>
